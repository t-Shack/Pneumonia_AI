<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Pneumonia Detection{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="frame">
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">
      <span class="brand-mark">&#9679;</span> PNEUMONIA&#8202;/&#8202;AI
    </a>
    <nav class="topnav">
      <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint == 'index' else '' }}">Scan</a>
      <a href="{{ url_for('dashboard') }}" class="{{ 'active' if request.endpoint == 'dashboard' else '' }}">Dashboard</a>
    </nav>
  </header>

  <div class="disclaimer">
    Research prototype &mdash; trained on a public academic dataset. Not a medical device. Not for clinical or diagnostic use.
  </div>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <span>Chest X-ray CNN &mdash; sigmoid / softmax comparison study</span>
  </footer>
</div>
{% block scripts %}{% endblock %}
</body>
</html>
